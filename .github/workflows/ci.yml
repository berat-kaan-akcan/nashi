name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust (fmt, clippy, test)
    runs-on: ubuntu-latest
    # Arch instead of Ubuntu: Ubuntu ships ImageMagick 6 (no `magick`), which
    # would make every image test skip. Arch's `rust` includes clippy + rustfmt.
    # Every optional tool is installed too, so document, EPUB and download
    # routes run here instead of skipping.
    container: archlinux:latest
    env:
      NASHI_SKIP_LOG: ${{ github.workspace }}/skipped.txt
    steps:
      - name: Install toolchain and external tools used by engine tests
        run: |
          pacman -Syu --noconfirm --needed \
            base-devel git rust \
            ffmpeg imagemagick libheif librsvg poppler ghostscript qpdf \
            perl-image-exiftool 7zip zbar \
            libreoffice-fresh libwpg pandoc-cli bubblewrap yt-dlp unrar qrencode

      # exiftool lives in /usr/bin/vendor_perl, normally added via /etc/profile.d.
      - name: Add vendor_perl to PATH
        run: echo /usr/bin/vendor_perl >> "$GITHUB_PATH"

      - uses: actions/checkout@v4

      - uses: Swatinem/rust-cache@v2

      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

      # Tests skip (not fail) when a tool is missing or unusable in this
      # container; list each one so a skip cannot go unnoticed.
      - name: Skipped tests
        if: always()
        run: |
          if [ -s skipped.txt ]; then
            sort skipped.txt | tee -a "$GITHUB_STEP_SUMMARY"
          else
            echo "No test was skipped." | tee -a "$GITHUB_STEP_SUMMARY"
          fi

  ui:
    name: Qt UI (build, offscreen tests)
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - name: Install build dependencies
        run: |
          pacman -Syu --noconfirm --needed \
            base-devel git cmake ninja python \
            qt6-base qt6-declarative qt6-tools qt6-svg layer-shell-qt

      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -S ui -B build/ui -G Ninja -DCMAKE_BUILD_TYPE=Debug

      - name: Build
        run: cmake --build build/ui

      - name: Test
        env:
          QT_QPA_PLATFORM: offscreen
        run: ctest --test-dir build/ui --output-on-failure

  forms:
    name: Forms on the real engine
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - name: Install Qt, Rust and the external tools
        run: |
          pacman -Syu --noconfirm --needed \
            base-devel git rust cmake ninja python \
            qt6-base qt6-declarative qt6-tools qt6-svg layer-shell-qt \
            ffmpeg imagemagick libheif librsvg poppler ghostscript qpdf \
            perl-image-exiftool 7zip zbar

      - name: Add vendor_perl to PATH
        run: echo /usr/bin/vendor_perl >> "$GITHUB_PATH"

      - uses: actions/checkout@v4

      - uses: Swatinem/rust-cache@v2

      - run: cargo build -p nashi-cli

      # tst_forms_engine skips itself without this binary, which would pass unnoticed.
      - run: test -x target/debug/nashi-cli

      - name: Configure
        run: cmake -S ui -B build/ui -G Ninja -DCMAKE_BUILD_TYPE=Debug

      - name: Build
        run: cmake --build build/ui --target tst_forms_engine

      - name: Test
        env:
          QT_QPA_PLATFORM: offscreen
        run: ctest --test-dir build/ui -R tst_forms_engine --output-on-failure

  lint:
    name: Packaging lint
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - name: Install linters
        run: |
          pacman -Syu --noconfirm --needed \
            git shellcheck desktop-file-utils appstream libxml2

      - uses: actions/checkout@v4

      - name: shellcheck
        run: |
          shellcheck packaging/install.sh packaging/nautilus/nashi-nautilus-script
          shellcheck -s bash -e SC2034,SC2154,SC2164 \
            packaging/arch/PKGBUILD packaging/arch/nashi.install

      - name: desktop-file-validate
        # packaging/dolphin/nashi.desktop is a KDE service menu (Type=Service),
        # which the freedesktop validator does not understand.
        run: desktop-file-validate data/*.desktop

      - name: appstreamcli validate
        run: appstreamcli validate --no-net data/*.metainfo.xml

      - name: SVG icon is well-formed
        run: xmllint --noout data/icons/hicolor/scalable/apps/*.svg
